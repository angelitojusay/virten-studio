# Builds the macOS .dmg and the Windows installer in the cloud and attaches both to a GitHub Release, which the app's
# updater (autostyle/sync.py) offers to every computer.
#   Release:  git tag v1.6.2 && git push origin v1.6.2   (the tag must match autostyle/__init__.py)
#   Any time: GitHub ▸ Actions ▸ "Build installers" ▸ Run workflow
# The installers go straight to the release, never through workflow artifacts: a private repository's artifact storage
# (500 MB on the free plan) can't hold one build's two installers. The release stays a pre-release (which the app's
# updater ignores) until both installers are attached, then "publish" makes it the latest release.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the release and upload its files

env:
  PYTHONIOENCODING: utf-8

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Version
        id: version
        run: |
          VERSION="$(python3 -c 'import sys; sys.path.insert(0, "."); from autostyle import __version__; print(__version__)')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $VERSION (autostyle/__init__.py)"; exit 1
          fi
      - name: Create the release as a pre-release (or reuse it on a re-run)
        run: |
          V="${{ steps.version.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release edit "v$V" --prerelease
          else
            gh release create "v$V" --title "Virten Studio $V" --target "$GITHUB_SHA" --prerelease --generate-notes
          fi

  build-macos:
    needs: prepare
    runs-on: macos-15  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false  # the AI models come from the cache below (Git LFS bandwidth is limited to 1 GB a month)
      - name: AI models (Git LFS, cached)
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          enableCrossOsArchive: true
      - run: git lfs pull && git lfs checkout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Version
        id: version
        run: |
          VERSION="$(python -c 'import sys; sys.path.insert(0, "."); from autostyle import __version__; print(__version__)')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $VERSION (autostyle/__init__.py)"; exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller -c packaging/constraints.txt

      - name: Make the app icon
        run: |
          ICONSET="$(mktemp -d)/VirtenStudio.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 64 128 256 512; do
            sips -z $s $s autostyle/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); sips -z $d $d autostyle/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o packaging/icon.icns
      - name: Build Virten Studio.app
        run: pyinstaller --noconfirm packaging/autostyle.spec
      - name: Licence check (no GPL-only or excluded components; notices cover every package)
        run: python packaging/check_bundle.py "dist/Virten Studio.app"
      - name: Ad-hoc code-sign (so Apple Silicon doesn't call the app "damaged")
        run: |
          codesign --force --deep --sign - "dist/Virten Studio.app"
          codesign --verify --deep --strict "dist/Virten Studio.app"
      - name: Self-test the signed app
        run: |
          REPORT="$HOME/Library/Application Support/Virten Studio/selftest.txt"
          if ! "dist/Virten Studio.app/Contents/MacOS/Virten Studio" --selftest; then
            cat "$REPORT" || true; exit 1
          fi
          cat "$REPORT"
      - name: Make the .dmg
        run: |
          DMG="dist/VirtenStudio-${VERSION}.dmg"
          STAGE="$(mktemp -d)"
          cp -R "dist/Virten Studio.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          for i in 1 2 3; do  # hdiutil is occasionally "busy" on hosted runners
            hdiutil create -volname "Virten Studio ${VERSION}" -srcfolder "$STAGE" -ov -format UDZO "$DMG" && break
            sleep 10
          done
          test -f "$DMG"
      - name: Attach the .dmg to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: dist/VirtenStudio-*.dmg
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false

  build-windows:
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: AI models (Git LFS, cached)
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          enableCrossOsArchive: true
      - run: git lfs pull && git lfs checkout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Version
        id: version
        run: |
          VERSION="$(python -c 'import sys; sys.path.insert(0, "."); from autostyle import __version__; print(__version__)')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $VERSION (autostyle/__init__.py)"; exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller -c packaging/constraints.txt
      - name: Build Virten Studio.exe
        run: |
          cp icon.ico packaging/icon.ico
          pyinstaller --noconfirm packaging/autostyle.spec
      - name: Licence check (no GPL-only or excluded components; notices cover every package)
        run: python packaging/check_bundle.py "dist/Virten Studio"
      - name: Self-test the built app
        shell: pwsh
        run: |
          # A windowed app: wait for it explicitly and use its exit code.
          $p = Start-Process -FilePath "dist\Virten Studio\Virten Studio.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\Virten Studio\selftest.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "The packaged app failed its self-test"; exit 1 }
      - name: Make the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Attach the installer to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: dist/VirtenStudio-Setup-*.exe
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false

  publish:
    # Only when both installers are attached: the release becomes the latest one, which the app's updater offers.
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check both installers are attached, then publish
        run: |
          V="${{ needs.prepare.outputs.version }}"
          ASSETS="$(gh release view "v$V" --json assets --jq '.assets[].name')"
          echo "$ASSETS"
          echo "$ASSETS" | grep -qx "VirtenStudio-$V.dmg" || { echo "::error::VirtenStudio-$V.dmg is missing"; exit 1; }
          echo "$ASSETS" | grep -qx "VirtenStudio-Setup-$V.exe" || { echo "::error::VirtenStudio-Setup-$V.exe is missing"; exit 1; }
          gh release edit "v$V" --prerelease=false --latest
