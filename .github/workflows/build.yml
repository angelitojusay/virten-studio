# Builds the macOS .dmg and the Windows installer in the cloud and attaches both to a GitHub Release, which the app's
# updater (autostyle/sync.py) offers to every computer.
#   Release:  git tag v1.6.1 && git push origin v1.6.1   (the tag must match autostyle/__init__.py)
#   Any time: GitHub ▸ Actions ▸ "Build installers" ▸ Run workflow
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the release and upload its files

env:
  PYTHONIOENCODING: utf-8

jobs:
  build-macos:
    runs-on: [self-hosted, macOS, ARM64]  # Apple Silicon
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false  # the AI models come from the cache below (Git LFS bandwidth is limited to 1 GB a month)
      - name: AI models (Git LFS, cached)
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          enableCrossOsArchive: true
      - run: git lfs pull && git lfs checkout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Version
        id: version
        run: |
          VERSION="$(python -c 'import sys; sys.path.insert(0, "."); from autostyle import __version__; print(__version__)')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $VERSION (autostyle/__init__.py)"; exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller -c packaging/constraints.txt

      - name: Make the app icon
        run: |
          ICONSET="$(mktemp -d)/VirtenStudio.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 64 128 256 512; do
            sips -z $s $s autostyle/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); sips -z $d $d autostyle/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o packaging/icon.icns
      - name: Build Virten Studio.app
        run: pyinstaller --noconfirm packaging/autostyle.spec
      - name: Ad-hoc code-sign (so Apple Silicon doesn't call the app "damaged")
        run: |
          codesign --force --deep --sign - "dist/Virten Studio.app"
          codesign --verify --deep --strict "dist/Virten Studio.app"
      - name: Self-test the signed app
        run: |
          REPORT="$HOME/Library/Application Support/Virten Studio/selftest.txt"
          if ! "dist/Virten Studio.app/Contents/MacOS/Virten Studio" --selftest; then
            cat "$REPORT" || true; exit 1
          fi
          cat "$REPORT"
      - name: Make the .dmg
        run: |
          DMG="dist/VirtenStudio-${VERSION}.dmg"
          STAGE="$(mktemp -d)"
          cp -R "dist/Virten Studio.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          for i in 1 2 3; do  # hdiutil is occasionally "busy" on hosted runners
            hdiutil create -volname "Virten Studio ${VERSION}" -srcfolder "$STAGE" -ov -format UDZO "$DMG" && break
            sleep 10
          done
          test -f "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: VirtenStudio-mac
          path: dist/VirtenStudio-*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: AI models (Git LFS, cached)
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          enableCrossOsArchive: true
      - run: git lfs pull && git lfs checkout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Version
        id: version
        run: |
          VERSION="$(python -c 'import sys; sys.path.insert(0, "."); from autostyle import __version__; print(__version__)')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $VERSION (autostyle/__init__.py)"; exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller -c packaging/constraints.txt
      - name: Build Virten Studio.exe
        run: |
          cp icon.ico packaging/icon.ico
          pyinstaller --noconfirm packaging/autostyle.spec
      - name: Self-test the built app
        shell: pwsh
        run: |
          # A windowed app: wait for it explicitly and use its exit code.
          $p = Start-Process -FilePath "dist\Virten Studio\Virten Studio.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\Virten Studio\selftest.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "The packaged app failed its self-test"; exit 1 }
      - name: Make the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: VirtenStudio-windows
          path: dist/VirtenStudio-Setup-*.exe
          if-no-files-found: error

  release:
    # One job publishes both files, so the two builds can't race to create the same release.
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-windows.outputs.version }}
          name: Virten Studio ${{ needs.build-windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/VirtenStudio-*.dmg
            dist/VirtenStudio-Setup-*.exe
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
